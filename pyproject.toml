[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "judgekit"
version = "0.1.0"
description = "Multi-judge LLM evaluation framework with cross-judge agreement statistics"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.34",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "datasets>=2.20",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "scikit-learn>=1.5",
]

[project.scripts]
judgekit = "judgekit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/judgekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "respx>=0.21",
]
